# JEDI/configs/judgment_config.yaml
#
# Configuration file for the 02_judge_harmfulness.py script.
# This script evaluates the harmfulness of assistant_output generated by 02_extract_activations.py.

# LLM name used to construct the input CSV filename.
# This should also match the base name of 'model_name' in extraction_config.yaml.
#llm_name: "vicuna_7b_v1_5"
llm_name: "mistral_7b_v2"

# --- Judge model configuration ---
# Classifier model used to judge harmfulness.
# We recommend the classifier provided by HarmBench.
# URL: https://huggingface.co/cais/HarmBench-Llama-2-13b-cls
classifier_model_name: "../../../models/HarmBench-Llama-2-13b-cls"
classifier_model_kwargs:
  torch_dtype: "bfloat16"
  trust_remote_code: True
  # Use "auto" to automatically place the model across available GPUs.
  device_map: "auto"

# --- Path configuration (relative to project root JEDI/) ---
# Directory containing *_outputs.csv files generated by 02_extract_activations.py.
# This should be the same as 'output_dir' in extraction_config.yaml.
data_dir: "data/activations"

# --- Processing parameters ---
processing:
  # The judge model is typically large; process one at a time to avoid VRAM issues.
  batch_size: 2
  # Device for running the classifier model. Ignored if device_map: "auto" is used.
  device: "cuda"
