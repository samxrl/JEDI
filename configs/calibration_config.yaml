# JEDI/configs/calibration_config.yaml
#
# Configuration file for the 04_calibrate_defense.py script.
# Used to calibrate parameters required by the online defense.

# Must match the `llm_name` used in 03_extract_vectors.py
# so we can locate the correct subdirectory in `artifacts_dir` and `activations_dir`.
#llm_name: "vicuna_7b_v1_5"
llm_name: "mistral_7b_v2"

# --- Path configuration (relative to project root JEDI/) ---
# Directory containing vectors and transformation matrices generated by 03_extract_vectors.py.
# The calibrated defense_config.json will also be saved here.
artifacts_dir: "data/activations"
# Directory containing activation files generated by 02_extract_activations.py.
activations_dir: "data/activations"

# --- Calibration parameters ---
calibration_params:
  # [!] New: number of processes for parallel processing.
  # Default is 4. If set to 0 or less, use all available CPU cores.
  num_processes: 10

  # Quantile used to compute the boundary threshold theta.
  # Intuitively, this means only (1 - quantile)% of benign samples
  # will yield a non-zero initial score.
  # Recommended values: 0.90 to 0.98
  theta_quantile: 0.95

  # When calibrating CUSUM parameters, we aim to find the best combination
  # that satisfies this false positive rate (FPR) constraint.
  # For example, 0.01 means we can tolerate at most 1% of benign samples
  # being incorrectly flagged as harmful.
  target_fpr: 0.05

  # Weight w for the delay term in multi-objective optimization.
  # Score = TPR + w * (1 / (Delay + 1))
  # Recommended to be small (e.g., 0.05 - 0.1) to keep TPR the main objective.
  delay_weight: 0.1

  # --- CUSUM parameter scan grid ---
  # Defines the search space for optimal alpha (alarm threshold) and k (tolerance band).
  # A finer grid increases search time but may yield better results.

  # Range and step for alpha (alarm threshold)
  alpha_min: 0
  alpha_max: 60
  alpha_step: 1
  # Range and step for k (tolerance band)
  k_min: 0
  k_max: 60
  k_step: 1
