# JEDI/configs/PCA_config.yaml
#
# Configuration file for the 03_extract_vectors.py script.
# This file controls vector extraction and subsequent per-token score computation.

# Must match the base name of `model_name` in extraction_config.yaml.
# This is used to locate the correct subdirectory in `data_dir`.
#llm_name: "vicuna_7b_v1_5"
llm_name: "mistral_7b_v2"

# --- Model configuration (for per-token score computation) ---
# After extracting vectors, the model must be reloaded to compute scores.
#model_path: "../../../models/vicuna_7b_v1_5"
model_path: "../../../models/mistral_7b_v2"

model_kwargs:
  torch_dtype: "bfloat16"
  trust_remote_code: True
  load_in_8bit: False


# --- Path configuration (relative to project root JEDI/) ---
# Directory containing activations and output files generated by 02_extract_activations.py.
data_dir: "data/activations"
# Directory to save final artifacts (vectors, transforms, scores).
output_dir: "data/activations"

# --- Vector extraction parameters ---
whitening:
  enabled: true
  epsilon: 0.0001
decoupling:
  enabled: true

# --- Score computation parameters ---
generation:
  # During score computation, the model generates content to obtain hidden states.
  # This value should match max_new_tokens in extraction_config.yaml.
  max_new_tokens: 128
processing:
  # Batch size during the scoring stage. Adjust based on VRAM.
  batch_size: 6
  device: "cuda"

# --- Optional visualization configuration ---
visualization:
  enabled: true
  sample_size: 200
