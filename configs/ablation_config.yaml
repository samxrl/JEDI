# JEDI/configs/evaluation_config.yaml
#
# Configuration file for scripts/run_evaluation.py.
# Used to evaluate the JEDI defense system on both safety and utility.

# Must match the `llm_name` used in 04_calibrate_defense.py
# This is used to locate the correct defense artifact subdirectory in `artifact_path`.
llm_name: "vicuna_7b_v1_5"
#llm_name: "mistral_7b_v2"
#llm_name: "Qwen2_5-7B-Instruct"


# --- Evaluation flow control ---
# Whether to run the utility (benign) dataset evaluation (FPR).
run_utility_evaluation: true
# Whether to run the safety (harmful) dataset evaluation (ASR).
run_safety_evaluation: true

# --- 1. Model paths ---
# Base LLM to evaluate (and protect).
llm_config:
  path: "../../../models/vicuna_7b_v1_5"
#  path: "../../../models/Qwen2_5-7B-Instruct"

  kwargs:
    torch_dtype: "bfloat16"
    trust_remote_code: True
    device_map: "auto" # Recommended for automatic GPU placement.

# Classifier model used to judge harmfulness.
classifier_config:
  path: "../../../models/HarmBench-Llama-2-13b-cls"
  kwargs:
    torch_dtype: "bfloat16"
    trust_remote_code: True
    device_map: "auto"

# --- 2. Artifacts and data paths (relative to project root JEDI/) ---
# Directory containing artifacts such as `defense_params.yaml`.
artifact_path: "data/activations"
# Directory containing evaluation datasets.
data_dir: "data/raw" # Assumes jbb_expanded.csv and benign data live here.
# Directory to save detailed evaluation results (CSV and JSON).
output_dir: "data/ablation"

# --- 3. Dataset configuration ---

# New config structure for utility evaluation.
utility_dataset_config:
  # Total sample size applied across all benign datasets (0 means all).
  # The script will attempt to draw equally from datasets below until reaching this total.
  sample_size: 0

  # Define one or more benign datasets to load.
  datasets:
#    - name: "benign_behaviors" # Suffix for output filenames.
#      filename: "benign-behaviors.csv" # Must exist in data_dir.
#      prompt_column: "Goal" # Prompt column name in the benign dataset.

#    - name: "or_bench" # Example of a second dataset.
#      filename: "or-bench-80k.csv" # Must exist in data_dir.
#      prompt_column: "prompt" # Prompt column name in this file.

    # You can add more datasets here...
    - name: "alpaca_eval"
      filename: "alpaca_eval.json"
      prompt_column: "instruction"
      max_new_tokens: 2048

    - name: "xstest"
      filename: "xstest_prompts.csv"
      prompt_column: "prompt"
      max_new_tokens: 512

# Used to evaluate safety.
safety_dataset_config:
  # Name of the jbb_expanded.csv file.
  filename: "jbb_expanded.csv"

  # Base columns describing each sample in the CSV.
  base_columns:
    - "Index"
    - "Goal"
    - "Target"
    - "Behavior"
    - "Category"
    - "Source"

  # [Key] Specify which attack columns to evaluate from jbb_expanded.csv.
  # The script computes ASR for each column name in this list.
  attack_columns_to_eval:
    - "PAIR"
    - "GCG"
    - "prompt_with_random_search"
    - "BETTER_DAN"
    - "new_renellm"
    - "new_tap"
    - "new_autodan"
    - "DEV_MODE_Ranti"
    - "new_gptfuzzer"
    - "new_deepinception"
    - "AIM"


  # Sample size for the safety dataset (0 means all).
  sample_size: 0
  # max_new_tokens used for safety dataset generation (defaults to generation_kwargs.max_new_tokens if unset).
  max_new_tokens: 256

# --- 4. Evaluation parameters ---
# --- 4.1 Ablation parameters ---
# Baseline value for beta ablation.
base_beta: 1.0

# Parameter lists for alpha/beta ablation (length-5 float lists).
alpha_list: [-10.0, -5.0, 0, 5.0, 10.0]
beta_list: [0.25, 0.5, 1.0, 1.5, 2.0]

# --- 4.2 Evaluation parameters ---
# Number of tokens to generate during evaluation.
generation_kwargs:
  max_new_tokens: 256
  do_sample: false

# Batch size for evaluation. Adjust based on VRAM.
batch_size: 12
# Batch size for the classifier model (usually smaller).
classifier_batch_size: 1
# Device to run the model on (if device_map is not used in llm_config.kwargs).
device: "cuda"
