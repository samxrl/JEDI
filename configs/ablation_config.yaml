# JEDI/configs/evaluation_config.yaml
#
# scripts/run_evaluation.py 脚本的配置文件。
# 用于评估 JEDI 防御系统在“安全性”和“可用性”方面的表现。
#
# [!] 此文件已更新，以支持多个良性数据集。

# 必须与 04_calibrate_defense.py 中使用的 `llm_name` 匹配
# 这用于在 `artifact_path` 中定位正确的防御产物子目录
llm_name: "vicuna_7b_v1_5"
#llm_name: "mistral_7b_v2"
#llm_name: "Qwen2_5-7B-Instruct"


# --- [新增] 评测流程控制 ---
# 控制是否运行“可用性”(良性)数据集的评测 (FPR)
run_utility_evaluation: true
# 控制是否运行“安全性”(有害)数据集的评测 (ASR)
run_safety_evaluation: true

# --- 1. 模型路径 ---
# 要被评估（和保护）的基础 LLM
llm_config:
  path: "../../../models/vicuna_7b_v1_5"
#  path: "../../../models/Qwen2_5-7B-Instruct"

  kwargs:
    torch_dtype: "bfloat16"
    trust_remote_code: True
    device_map: "auto" # 推荐使用以自动分配 GPU

# 用于判断“有害性”的分类器模型
classifier_config:
  path: "../../../models/HarmBench-Llama-2-13b-cls"
  kwargs:
    torch_dtype: "bfloat16"
    trust_remote_code: True
    device_map: "auto"

# --- 2. 产物和数据路径 (相对于项目根目录 JEDI/) ---
# 包含 `defense_params.yaml` 等产物的目录
artifact_path: "data/activations"
# 包含评测数据集的目录
data_dir: "data/raw" # 假设 jbb_expanded.csv 和良性数据都在这里
# 保存详细评测结果 (CSV 和 JSON) 的目录
output_dir: "data/ablation"

# --- 3. 数据集配置 ---

# [!] 用于评估“可用性”的新配置结构
utility_dataset_config:
  # 应用于所有良性数据集的 *总* 采样大小 (0 表示全部)
  # 脚本将尝试从下面的数据集中等额抽取，直到达到此总数。
  sample_size: 0

  # 定义一个或多个要加载的良性数据集
  datasets:
#    - name: "benign_behaviors" # 用于保存结果的文件名后缀
#      filename: "benign-behaviors.csv" # 确保在 data_dir 中存在
#      prompt_column: "Goal" # 良性数据集中的提示列名

#    - name: "or_bench" # 第二个数据集的示例
#      filename: "or-bench-80k.csv" # 确保在 data_dir 中存在
#      prompt_column: "prompt" # 此文件的提示列名

    # 您可以在此处添加更多数据集...
    - name: "alpaca_eval"
      filename: "alpaca_eval.json"
      prompt_column: "instruction"
      max_new_tokens: 2048

    - name: "xstest"
      filename: "xstest_prompts.csv"
      prompt_column: "prompt"
      max_new_tokens: 512

# 用于评估“安全性”
safety_dataset_config:
  # jbb_expanded.csv 文件的名称
  filename: "jbb_expanded.csv"

  # CSV 中描述样本的基础列
  base_columns:
    - "Index"
    - "Goal"
    - "Target"
    - "Behavior"
    - "Category"
    - "Source"

  # 【关键】指定要从 jbb_expanded.csv 中评估哪些攻击列
  # 脚本将为列表中的每个列名分别计算 ASR
  attack_columns_to_eval:
    - "PAIR"
    - "GCG"
    - "prompt_with_random_search"
    - "BETTER_DAN"
    - "new_renellm"
    - "new_tap"
    - "new_autodan"
    - "DEV_MODE_Ranti"
    - "new_gptfuzzer"
    - "new_deepinception"
    - "AIM"


  # 安全性数据集的采样大小 (0 表示全部)
  sample_size: 0
  # [新增] 安全性数据集生成时的 max_new_tokens (未设置则使用 generation_kwargs.max_new_tokens)
  max_new_tokens: 256

# --- 4. 评测参数 ---
# --- 4.1 消融实验参数 ---
# beta 消融实验的基准值
base_beta: 1.0

# alpha/beta 消融实验的参数列表 (长度为 5 的浮点数列表)
alpha_list: [-10.0, -5.0, 0, 5.0, 10.0]
bata_list: [-1.0, 0, 1.0, 2.0, 3.0]

# --- 4.2 评测参数 ---
# 在评测时要生成的 token 数量
generation_kwargs:
  max_new_tokens: 256
  do_sample: false

# 评测时使用的批量大小。根据显存（VRAM）进行调整。
batch_size: 12
# 分类器模型的批量大小 (通常需要更小)
classifier_batch_size: 1
# 运行模型的设备 (如果 llm_config.kwargs 中未使用 device_map)
device: "cuda"
