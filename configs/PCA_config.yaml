# SARC/configs/PCA_config.yaml
#
# 03_extract_vectors.py 脚本的配置文件。
# 该文件用于控制向量提取和后续的逐 token 分数计算。

# 必须与 extraction_config.yaml 中的 `model_name` 的基本名称匹配。
# 这用于在 `data_dir` 中定位正确的子目录。
llm_name: "vicuna_7b_v1_5"

# --- 模型配置 (用于逐 token 分数计算) ---
# 在提取向量后，需要重新加载模型以计算分数。
model_path: "../../../models/vicuna_7b_v1_5"
model_kwargs:
  torch_dtype: "bfloat16"
  trust_remote_code: True

# --- 路径配置 (相对于项目根目录 SARC/) ---
# 包含由 02_extract_activations.py 生成的激活和输出文件的目录。
data_dir: "data/activations"
# 保存最终产物（向量、变换、分数）的目录。
output_dir: "data/activations"

# --- 向量提取参数 ---
whitening:
  enabled: true
  epsilon: 0.0001
decoupling:
  enabled: true

# --- 分数计算参数 ---
generation:
  # 在计算分数时，模型需要生成内容以获取隐藏状态。
  # 此值应与 extraction_config.yaml 中的 max_new_tokens 保持一致。
  max_new_tokens: 64
processing:
  # 分数计算阶段的批量大小。根据显存（VRAM）进行调整。
  batch_size: 5
  device: "cuda"

# --- 可选的可视化配置 ---
visualization:
  enabled: true
  sample_size: 200
